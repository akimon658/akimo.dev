name: Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'wrangler.jsonc'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required: article dates fall back to Git creation
          # dates via @inox-tools/content-utils.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          TZ: Asia/Tokyo
        run: pnpm build

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ALIAS="pr-${{ github.event.pull_request.number }}"
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" 2>&1 | tee wrangler-output.txt
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' wrangler-output.txt | head -n 1)
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const alias = '${{ steps.upload.outputs.alias }}';
            const url = '${{ steps.upload.outputs.url }}'.trim();
            const body = url
              ? `Preview deployed: ${url} (alias \`${alias}\`)\n\nThis preview does not affect production (\`akimo.dev\`).`
              : `Preview upload finished, but the URL could not be parsed from Wrangler output. Check the workflow logs. (alias \`${alias}\`)`;
            const marker = `<!-- workers-preview-${{ github.event.pull_request.number }} -->`;
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
